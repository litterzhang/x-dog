[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-ai"
version = "0.57.1"
description = "Unified multi-provider LLM API"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [{ name = "HugeMan" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=2.38,<3"]
all = ["openai>=2.38,<3"]

[project.urls]
Homepage = "https://xdog.942295.xyz"
Repository = "https://github.com/litterzhang/x-dog"
Documentation = "https://xdog.942295.xyz"
Issues = "https://github.com/litterzhang/x-dog/issues"

[project.scripts]
xdog-ai = "xdog.ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
