[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai"
version = "0.57.1"
description = "Unified multi-provider LLM API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=2.38,<3"]
all = ["openai>=2.38,<3"]

[project.scripts]
xdog-ai = "ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
