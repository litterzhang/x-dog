[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tui"
version = "0.57.1"
description = "Terminal UI library with differential rendering"
requires-python = ">=3.12"
authors = [{ name = "HugeMan" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "wcwidth>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
