[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding"
version = "0.57.1"
description = "Interactive coding agent CLI"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "ai",
    "agent",
    "tui",
    "pyyaml>=6.0",
]

[project.scripts]
xdog-coding = "coding.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
