[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow"
version = "0.57.1"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "ai",
    "agent",
    "tui",
    "pydot",
    "jsonpath-ng",
    "fastjsonschema",
]

[project.scripts]
xdog-flow = "flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flow"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Untyped third-party imports. Keep this list to modules flow actually imports —
# warn_unused_configs reports dead entries, and a stale one hides a real gap.
# (fastjsonschema is agent's runtime dep, not flow's; flow never imports it.)
module = ["agent.*", "ai.*", "ai", "pydot", "jsonpath_ng"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
