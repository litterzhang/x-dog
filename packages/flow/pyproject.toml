[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow"
version = "0.57.1"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "ai",
    "agent",
    "tui",
]

[project.scripts]
xdog-flow = "flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flow"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["agent.*", "ai.*", "ai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
