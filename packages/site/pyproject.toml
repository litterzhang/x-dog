[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-site"
version = "0.1.0"
description = "x-dog public site: package overview, blog, and FAQ (Flask)"
requires-python = ">=3.12"
authors = [{ name = "HugeMan" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "flask>=3.0",
    "markdown>=3.5",
    "python-frontmatter>=1.0",
    "pygments>=2.17",
]

[project.urls]
Homepage = "https://xdog.942295.xyz"
Repository = "https://github.com/litterzhang/x-dog"
Documentation = "https://xdog.942295.xyz"
Issues = "https://github.com/litterzhang/x-dog/issues"

[project.scripts]
xdog-site = "xdog.site.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "flask", "flask.*", "jinja2", "jinja2.*", "markupsafe", "markupsafe.*", "flow", "flow.*",
    "markdown", "markdown.*", "frontmatter", "frontmatter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
