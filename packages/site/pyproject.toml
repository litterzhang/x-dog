[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site"
version = "0.1.0"
description = "x-dog public site: package overview, blog, and FAQ (Flask)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
xdog-site = "xdog_site.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdog_site"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["flask", "flask.*", "jinja2", "jinja2.*", "markupsafe", "markupsafe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
