{% extends "base.html" %}
{% block title %} — {{ pkg.name }} / {{ page_label }}{% endblock %}
{% block ctitle %}/ Packages / {{ pkg.name }} / {{ page_label }}{% endblock %}

{% block content %}
<section class="markdown-body">
  {{ content }}
</section>

<section>
  <div>
    <a href="{{ url_for('main.package_detail', name=pkg.name) }}" class="btn btn-ghost btn-default btn-small">&larr; {{ pkg.name }} overview</a>
    {% if has_docs %}
    <a href="{{ url_for('main.package_features', name=pkg.name) }}" class="btn btn-ghost btn-default btn-small">Features</a>
    <a href="{{ url_for('main.package_roadmap', name=pkg.name) }}" class="btn btn-ghost btn-default btn-small">Roadmap</a>
    {% endif %}
  </div>
</section>
{% endblock %}
