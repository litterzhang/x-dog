{% extends "base.html" %}
{% block title %} — flow / Features{% endblock %}
{% block ctitle %}/ Packages / flow / Features{% endblock %}

{% block content %}
<section>
  <h2>Features</h2>
  <div>What flow can do today.</div>
</section>

<section>
  <div class="cards grid">
    {% for f in features %}
      <div class="card -5of12 cell">
        <header class="card-header">{{ f.title }}</header>
        <div class="card-content">
          <div class="inner">
            <div>{{ f.detail }}</div>
          </div>
        </div>
      </div>
      <div class="cell -1of12 spacer"></div>
    {% endfor %}
  </div>
</section>
{% endblock %}
