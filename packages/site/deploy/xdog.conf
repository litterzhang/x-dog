# nginx site for the xdog docs/marketing site.
#
# Mirrors depins.conf: an HTTP->HTTPS redirect plus a TLS server that reverse-
# proxies to the xdog-site systemd user service (see xdog-site.service).
#
# Install (as root):
#   cp xdog.conf /etc/nginx/conf.d/xdog.conf
#   # edit server_name + ssl_certificate paths for your host
#   nginx -t && systemctl reload nginx

server {
    listen       80;
    server_name  xdog.942295.xyz;

    # Send plain HTTP straight to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  xdog.942295.xyz;

    ssl_certificate     /etc/nginx/ssl/942295/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/942295/key.pem;

    access_log  /var/log/nginx/xdog.access.log  main;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://xdog-site;
    }
}

upstream xdog-site {
    server 127.0.0.1:8080;
}
