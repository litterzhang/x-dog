[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.57.1"
description = "Agent runtime with tool calling and state management"
requires-python = ">=3.12"
authors = [{ name = "HugeMan" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "ai",
    "fastjsonschema",
]

[project.scripts]
xdog-agent = "agent.cli:main"

[[tool.mypy.overrides]]
module = ["fastjsonschema"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
