name: publish

# Publishes the four distributions to PyPI via Trusted Publishing (OIDC) — no API
# token is stored anywhere. PyPI verifies the request came from this repository,
# this workflow file, and the named environment.
#
# Two ways in:
#   * push a tag `v0.57.1`  → builds and publishes to PyPI
#   * Run workflow…         → choose testpypi (default) or pypi
#
# Publish order does not matter: PyPI does not resolve Requires-Dist at upload
# time, only at install time, and all four land in the same run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      packages:
        description: >-
          JSON array of packages to publish. PyPI allows only three *pending*
          trusted publishers at a time, so a first release has to go in waves —
          publish three, which converts their pending publishers to regular ones
          and frees the slots, then register and publish the rest.
        default: '["xdog-ai","xdog-tui","xdog-agent","xdog-flow","xdog-claw","xdog-coding"]'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Everything except `xdog-site`, which is the website itself rather
        # than a library anyone would install.
        package: ${{ fromJSON(inputs.packages || '["xdog-ai","xdog-tui","xdog-agent","xdog-flow","xdog-claw","xdog-coding"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build --package ${{ matrix.package }} --out-dir dist
      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest packages/flow/tests packages/site/tests -q
      - run: uv run ruff check packages
      - run: uv run mypy --strict -p xdog.flow

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    strategy:
      # One environment per package: PyPI keys a *pending* publisher on
      # (owner, repository, workflow, environment), so six packages sharing one
      # environment name is ambiguous — it cannot tell which project an upload
      # should create — and registering the second one is rejected outright.
      # Per-package environments also mean one package failing does not block
      # the rest, and each can carry its own approval gate.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages || '["xdog-ai","xdog-tui","xdog-agent","xdog-flow","xdog-claw","xdog-coding"]') }}
    environment:
      name: >-
        ${{ (github.event_name == 'push' || inputs.target == 'pypi')
            && format('pypi-{0}', matrix.package)
            || format('testpypi-{0}', matrix.package) }}
    permissions:
      # Mints the short-lived OIDC token PyPI trades for an upload token.
      # Without this the action silently falls back to looking for a password.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates versions from earlier dry runs; re-running a
          # build that produced identical files should not fail the job.
          skip-existing: true
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # Only for tag pushes, and only once PyPI accepted the upload — a Release
    # that points at versions nobody can install is worse than no Release.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
