name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync

      - name: Tests
        run: uv run pytest packages/flow/tests packages/site/tests -q

      - name: Lint
        run: uv run ruff check packages

      - name: Types
        run: uv run mypy --strict -p xdog.flow

      # The examples are executable artifacts, not decoration: this catches a
      # workflow whose companion suite stopped passing after a kernel change.
      - name: Example suites
        run: uv run xdog-flow test packages/flow/examples/ --allow-script-stub

      # The examples and the authoring skill are force-included into the wheel.
      # Nothing in the unit tests can see that — an editable install has them at
      # their source paths — so check the artifact CI actually produces.
      - name: Wheel ships the examples and the skill
        run: |
          uv build --package xdog-flow --out-dir /tmp/wheelcheck
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("/tmp/wheelcheck/*.whl")[0]).namelist()
          need = [
              "xdog/flow/examples/agent_calculator.json",
              "xdog/flow/examples/depins_enrich/cycle.py",
              "xdog/flow/skill/SKILL.md",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"wheel is missing packaged data: {missing}")
          print(f"wheel carries {len([n for n in names if '/examples/' in n])} example files")
          PY

      # A dependency named `ai` or `flow` on PyPI is somebody else's package.
      # Publishing metadata that points at one is a supply-chain bug, so fail
      # the build rather than discover it after upload.
      - name: No bare inter-package requirements
        run: |
          uv build --package xdog-flow --out-dir /tmp/metacheck
          python - <<'PY'
          import glob, re, sys, zipfile
          wheel = glob.glob("/tmp/metacheck/*.whl")[0]
          meta = zipfile.ZipFile(wheel).read(
              next(n for n in zipfile.ZipFile(wheel).namelist() if n.endswith("METADATA"))
          ).decode()
          reqs = re.findall(r"^Requires-Dist: (\S+)", meta, re.M)
          bad = [r for r in reqs if r in {"ai", "agent", "tui", "flow", "claw", "coding", "site"}]
          print("Requires-Dist:", reqs)
          if bad:
              sys.exit(f"bare inter-package requirement(s) would resolve to unrelated PyPI projects: {bad}")
          PY
